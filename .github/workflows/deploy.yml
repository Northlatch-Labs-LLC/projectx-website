name: Deploy to Vercel

# Vercel's Hobby plan cannot connect to a private repository owned by an
# organisation, so pushes no longer reach Vercel on their own. This workflow
# does what that connection used to do: build with the Vercel CLI and ship the
# prebuilt output to production.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The gate, before anything is built or shipped. `check` is typecheck, tests, guardrails and
      # the verify scripts; a non-zero exit from any of them stops the job here and nothing reaches
      # production.
      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The token is read into an env var and stripped of whitespace before use.
      #
      # Interpolating a secret straight into the command line is how this failed for a day: a
      # token stored with a trailing newline — which `echo | gh secret set` adds, and which is
      # invisible in the secrets UI — was passed verbatim and Vercel answered "the token provided
      # via `--token` argument is not valid". The token was fine. The newline was not.
      - name: Pull production settings
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          test -n "$TOKEN" || { echo "VERCEL_TOKEN is empty after stripping whitespace"; exit 1; }
          echo "VERCEL_TOKEN_CLEAN=$TOKEN" >> "$GITHUB_ENV"
          vercel pull --yes --environment=production --token="$TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN_CLEAN"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN_CLEAN"
