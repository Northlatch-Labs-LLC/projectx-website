name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production settings
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          test -n "$TOKEN" || { echo "VERCEL_TOKEN is empty after stripping whitespace"; exit 1; }
          echo "VERCEL_TOKEN_CLEAN=$TOKEN" >> "$GITHUB_ENV"
          vercel pull --yes --environment=production --token="$TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN_CLEAN"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN_CLEAN"
