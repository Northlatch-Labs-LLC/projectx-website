# included in every location: nginx drops server-level add_header in any
# location that sets its own, so the headers live here and are included
# explicitly.
# Scripts and styles from this origin only. The one outbound request is the
# contact form, to the same form endpoint the current build uses. The bundle
# verifier never makes a request: it hashes in the browser.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://readdy.ai; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
