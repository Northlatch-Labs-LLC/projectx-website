# Behind the platform's proxy, which terminates TLS. The security headers are
# the design's own file, included per location: nginx drops inherited
# add_header lines in any location that sets its own.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;

  # Every route is a real page: /tools is tools.html, and so on.
  location / {
    include /etc/nginx/xlaunch/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ =404;
  }

  # nginx's type table does not know this extension.
  location = /site.webmanifest {
    include /etc/nginx/xlaunch/security-headers.conf;
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
  }

  # Fonts never change under the same name.
  location ~* \.woff2$ {
    include /etc/nginx/xlaunch/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # Unhashed names, so a short life and a revalidation: a deploy shows within the hour.
  location ~* \.(css|js|svg|png)$ {
    include /etc/nginx/xlaunch/security-headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/xlaunch/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
}
